[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "bastar-innovate"
version = "1.0.0"
description = "One Institution - One Startup: Research-Backed Venture Intelligence Platform for B.Tech Bastar"
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
    "pydantic>=2.0.0",
    "rich>=12.0.0",
    "click>=8.0.0",
    "streamlit>=1.28.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "pytest-cov>=4.0.0",
]

[project.scripts]
bastar-innovate = "bastar_innovate.cli:main"

[tool.setuptools.packages.find]
include = ["bastar_innovate*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
